# ODrive — Cloudflare Workers deployment source of truth.
#
# NON-SECRET configuration only. Secrets are stored as Worker Secrets:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put ODRIVE_ENCRYPTION_KEY
#   ...see .env.example and src/config/runtime-env.server.ts
#
# keep_vars = true stops a deploy from wiping runtime variables that were set
# outside this file. Worker Secrets are always preserved across deploys.

name = "odrive"
main = "./dist/server/index.mjs"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[assets]
binding = "ASSETS"
directory = "./dist/client"

[vars]
ENVIRONMENT = "production"
# Fill with public deployment values; the preflight rejects blanks.
APP_URL = ""
SUPABASE_URL = ""
SUPABASE_PUBLISHABLE_KEY = ""

# Required secret names (values live in Cloudflare Secrets, never here):
#   SUPABASE_SERVICE_ROLE_KEY, ODRIVE_ENCRYPTION_KEY
# Optional secret names:
#   LOVABLE_API_KEY, LOVABLE_SEND_URL, LOVABLE_CRON_SECRET,
#   LOVABLE_CRON_SECRET_PREVIOUS, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET, DROPBOX_CLIENT_ID,
#   DROPBOX_CLIENT_SECRET

[env.staging]
name = "odrive-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
# Use the staging project and URL. Named environment vars do not inherit.
APP_URL = ""
SUPABASE_URL = ""
SUPABASE_PUBLISHABLE_KEY = ""

[env.production]
name = "odrive"

[env.production.vars]
ENVIRONMENT = "production"
# Fill with public deployment values; the preflight rejects blanks.
APP_URL = ""
SUPABASE_URL = ""
SUPABASE_PUBLISHABLE_KEY = ""

